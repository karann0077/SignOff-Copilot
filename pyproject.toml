[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signoff-copilot"
version = "0.1.0"
description = "AI-assisted RTL-to-timing EDA signoff automation tool"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["EDA", "VLSI", "STA", "AI", "signoff", "RISC-V", "OpenSTA", "Yosys"]
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "openai>=1.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.28", "plotly>=5.18"]
pdf       = ["weasyprint>=60.0"]
dev       = ["pytest>=7.0", "pytest-cov>=4.1"]

[project.scripts]
signoff-copilot = "signoff_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"signoff_copilot" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"
